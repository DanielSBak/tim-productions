<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIM PRODUCTIONS | Liquid Chrome</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --chrome-light: #ffffff;
            --chrome-mid: #a8a8b0;
            --chrome-dark: #3a3a40;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--chrome-light);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Mercury Drop Animation */
        .mercury-drop {
            position: absolute;
            top: -100px;
            left: 50%;
            width: 30px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, #fff, #999, #111);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transform: translateX(-50%);
            z-index: 100;
            animation: fallAndSplash 3s ease-in forwards;
            box-shadow: 0 10px 20px rgba(255,255,255,0.2), inset 0 0 10px rgba(255,255,255,0.8);
        }

        @keyframes fallAndSplash {
            0% { top: -100px; transform: translateX(-50%) scale(1); opacity: 1; }
            60% { top: 40vh; transform: translateX(-50%) scale(0.9, 1.2); opacity: 1; }
            65% { top: 45vh; transform: translateX(-50%) scale(2.5, 0.3); border-radius: 50%; opacity: 1; }
            75% { top: 45.5vh; transform: translateX(-50%) scale(6, 0.1); opacity: 0.5; }
            100% { top: 46vh; transform: translateX(-50%) scale(10, 0); opacity: 0; }
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .chrome-text {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            background-image: linear-gradient(
                to bottom, 
                #ffffff 0%, 
                #a8a8b0 40%, 
                #1a1a20 50%, 
                #5a5a60 60%, 
                #ffffff 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 5px 10px rgba(255,255,255,0.15));
            text-align: center;
            margin: 0;
            animation: fadeIn 4s ease forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            0%, 50% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .tagline {
            margin-top: 10px;
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--chrome-mid);
            animation: fadeIn 5s ease forwards;
            opacity: 0;
        }

        /* Gallery Section */
        .gallery-section {
            padding: 100px 5vw;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 50px;
            color: var(--chrome-light);
            letter-spacing: 2px;
        }

        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            grid-auto-rows: 300px;
        }

        .photo-placeholder {
            background: linear-gradient(135deg, #111, #222);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #444;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        /* Liquid hover effect on photos */
        .photo-placeholder::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-25deg);
            transition: all 0.7s ease;
        }

        .photo-placeholder:hover::before {
            left: 200%;
        }

        .photo-placeholder:hover {
            border-color: rgba(168, 168, 176, 0.5);
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(255,255,255,0.05);
        }

        .photo-large { grid-row: span 2; }

        /* About Section */
        .about-section {
            padding: 100px 10vw;
            background: radial-gradient(circle at center, #111 0%, #050505 100%);
            text-align: center;
        }

        .about-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .about-text {
            font-size: 1.2rem;
            line-height: 1.8;
            color: var(--chrome-mid);
            font-weight: 300;
        }

        .highlight {
            color: #fff;
            font-weight: 400;
        }

        /* Booking Section */
        .booking-section {
            padding: 100px 5vw;
            display: flex;
            justify-content: center;
        }

        .booking-form {
            background: rgba(15, 15, 18, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 600px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 30px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--chrome-mid);
        }

        .form-control {
